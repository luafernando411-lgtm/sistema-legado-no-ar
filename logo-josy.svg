<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title description">
  <title id="title">Josy Performe Premium</title>
  <desc id="description">Monograma JP dourado em medalhão preto, com a marca Josy Performe Premium.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a3507"/>
      <stop offset=".25" stop-color="#c98b2c"/>
      <stop offset=".52" stop-color="#f2cb69"/>
      <stop offset=".77" stop-color="#b7771b"/>
      <stop offset="1" stop-color="#f1c65c"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#351506"/>
      <stop offset=".36" stop-color="#69330b"/>
      <stop offset=".57" stop-color="#d09a38"/>
      <stop offset=".78" stop-color="#9c5b15"/>
      <stop offset="1" stop-color="#321407"/>
    </linearGradient>
  </defs>
  <circle cx="384" cy="300" r="142" fill="url(#gold)"/>
  <circle cx="384" cy="300" r="130" fill="#fff"/>
  <circle cx="384" cy="300" r="121" fill="url(#gold)"/>
  <circle cx="384" cy="300" r="111" fill="#050505"/>
  <text x="384" y="359" text-anchor="middle" fill="url(#gold)" font-family="Bodoni 72, Didot, Georgia, serif" font-size="174" font-weight="400">JP</text>
  <text x="384" y="514" text-anchor="middle" fill="url(#wordmark)" font-family="Bodoni 72, Didot, Georgia, serif" font-size="76" font-weight="500">Josy Performe</text>
  <text x="384" y="559" text-anchor="middle" fill="#75410f" font-family="Georgia, serif" font-size="23" letter-spacing="12">PREMIUM</text>
</svg>
