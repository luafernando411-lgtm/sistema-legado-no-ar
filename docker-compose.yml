services:
  censo:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure uma chave aleatoria forte no .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure outra chave aleatoria forte no .env}
      DATABASE_URL: postgresql+psycopg://censo:${POSTGRES_PASSWORD:?Configure uma senha forte no .env}@db:5432/censo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure uma senha forte no .env}
      CENSO_LUIZ_PASSWORD: ${CENSO_LUIZ_PASSWORD:?Configure a senha do primeiro usuario no .env}
      CENSO_JOSY_PASSWORD: ${CENSO_JOSY_PASSWORD:?Configure a senha do segundo usuario no .env}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      UPLOAD_FOLDER: /app/uploads
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      - censo_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: censo
      POSTGRES_USER: censo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure uma senha forte no .env}
    volumes:
      - censo_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U censo -d censo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  censo_uploads:
  censo_database:
