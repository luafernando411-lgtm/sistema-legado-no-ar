 <div class="grid2">
 ${card('Proventos x Base x Descontos',`<div class="chart"><canvas id="c1"></canvas></div>`)}
 ${card('Indicadores da Folha Ativa',`<div class="metric-list">
 <div class="metric-line"><span>Base / Proventos</span><div class="progress"><i style="width:${(p.base/p.proventos*100).toFixed(1)}%"></i></div><strong>${pct(p.base,p.proventos)}</strong></div>
 <div class="metric-line"><span>Descontos / Proventos</span><div class="progress"><i style="width:${(p.descontos/p.proventos*100).toFixed(1)}%"></i></div><strong>${pct(p.descontos,p.proventos)}</strong></div>
 <div class="metric-line"><span>Patronal / Base</span><div class="progress"><i style="width:${(p.patronal/p.base*100).toFixed(1)}%"></i></div><strong>${pct(p.patronal,p.base)}</strong></div>
 </div>`)}
 </div>
 <div class="note">Os valores acima são os totais informados na Relação de Funcionários do RPPS, competência Março/2026.</div>`;
}
function draw(){
 if(page==='overview'){
  chart('o1','doughnut',{labels:['Sem conclusão','Concluídos'],datasets:[{data:[DATA.censo.sem_conclusao,DATA.censo.concluidos],backgroundColor:[C.orange,C.green],borderColor:'#f7f9f8',borderWidth:2}]},{cutout:'58%'});
  chart('o2','bar',{labels:['Ativos','Apos. idade/tempo','Apos. invalidez','Pensionistas','Apos. idade'],datasets:[bar([76,36,4,4,8],C.blue)]});
  chart('o3','bar',{labels:Object.keys(DATA.cadastro_counts),datasets:[bar(Object.values(DATA.cadastro_counts),C.green)]});
  const labs=Object.keys(DATA.cargo_counts).reverse(), vals=Object.values(DATA.cargo_counts).reverse();
  chart('o4','bar',{labels:labs,datasets:[bar(vals,C.green2)]},{indexAxis:'y'});
 }
 if(page==='segurados'){
  chart('s1','doughnut',{labels:['Apos. idade/tempo','Apos. invalidez','Pensionistas','Apos. idade'],datasets:[{data:[36,4,4,8],backgroundColor:[C.blue,C.orange,C.red,C.green],borderColor:'#f7f9f8',borderWidth:2}]},{cutout:'58%'});
  const labs=Object.keys(DATA.cargo_counts).slice(0,8).reverse(),vals=Object.values(DATA.cargo_counts).slice(0,8).reverse();
  chart('s2','bar',{labels:labs,datasets:[bar(vals,C.green)]},{indexAxis:'y'});
  chart('s3','bar',{labels:['Ativos','Idade/tempo','Invalidez','Pensão','Idade'],datasets:[bar([76,36,4,4,8],C.blue)]});
 }
 if(page==='beneficios'){
  const p=DATA.payroll;
  chart('b1','bar',{labels:p.beneficios.map(x=>x.tipo.replace('Aposentados ','Apos. ').replace('Aposentadoria ','Apos. ')),datasets:[bar(p.beneficios.map(x=>x.quantidade),C.green)]},{indexAxis:'y'});
  chart('b2','bar',{labels:p.beneficios.map(x=>x.tipo.replace('Aposentados ','Apos. ').replace('Aposentadoria ','Apos. ')),datasets:[bar(p.beneficios.map(x=>x.vencimentos),C.blue)]},{indexAxis:'y',scales:{x:{grid:{color:C.grid},ticks:{font:{size:8},callback:v=>'R$ '+(v/1000).toFixed(0)+' mil'}},y:{grid:{display:false},ticks:{font:{size:8}}}}});
  chart('b3','doughnut',{labels:p.beneficios.map(x=>x.tipo),datasets:[{data:p.beneficios.map(x=>x.quantidade),backgroundColor:[C.blue,C.orange,C.red,C.green],borderColor:'#f7f9f8',borderWidth:2}]},{cutout:'58%'});
 }
 if(page==='contribuicoes'){
  const p=DATA.payroll.ativos;
  chart('c1','bar',{labels:['Proventos','Valor Base','Descontos','Patronal'],datasets:[bar([p.proventos,p.base,p.descontos,p.patronal],C.blue)]},{scales:{x:{grid:{display:false},ticks:{font:{size:8}}},y:{grid:{color:C.grid},ticks:{font:{size:8},callback:v=>'R$ '+(v/1000).toFixed(0)+' mil'}}}});
 }
}
function render(){
 destroy();
 document.getElementById('brand').textContent=page==='overview'?'Censo Previdenciário — Dados e Diagnóstico':page==='cadastro'?'Base do Censo Previdenciário':page==='segurados'?'Segurados e Base do RPPS':page==='beneficios'?'Benefícios Previdenciários':'Contribuições e Base Previdenciária';
 document.getElementById('content').innerHTML=page==='overview'?overview():page==='cadastro'?cadastro():page==='segurados'?segurados():page==='beneficios'?beneficios():contribuicoes();
 filters();
 requestAnimationFrame(()=>{draw();if(page==='cadastro')renderCadastroTable()});
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;document.querySelectorAll('.tab,.side').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()}));
render();
</script>
</body>
</html>
